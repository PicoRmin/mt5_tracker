{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50">
    <div class="max-w-md w-full space-y-8 p-10 bg-white rounded-xl shadow-md">
        <div class="text-center">
            <h2 class="mt-6 text-3xl font-bold text-gray-900">
                خوش آمدید به MT5 Tracker
            </h2>
            <p class="mt-2 text-sm text-gray-600">
                سیستم مدیریت معاملات متاتریدر ۵
            </p>
        </div>

        <div class="mt-8 space-y-6">
            <div class="grid grid-cols-2 gap-4">
                <a href="{% url 'accounts:login' %}" 
                   class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    ورود
                </a>
                <a href="{% url 'accounts:register' %}" 
                   class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-blue-600 bg-white border-blue-600 hover:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    ثبت نام
                </a>
            </div>
            
            <div class="text-center mt-4">
                <a href="{% url 'accounts:dashboard' %}" class="text-sm text-blue-600 hover:text-blue-800">
                    ادامه به عنوان مهمان
                </a>
            </div>
        </div>
    </div>
</div>

<script>
    // GSAP Animation for home page
    gsap.from(".max-w-md", {
        duration: 0.8,
        y: 50,
        opacity: 0,
        ease: "back.out(1.7)"
    });
</script>
{% endblock %}
