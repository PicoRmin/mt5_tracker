{% extends 'base.html' %}

{% block title %}پروفایل کاربر{% endblock %}

{% block content %}
<div class="p-6">
    <div class="max-w-3xl mx-auto">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">پروفایل کاربری</h2>
        
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <div class="p-6 border-b border-gray-200">
                <h3 class="text-lg font-medium text-gray-800">اطلاعات شخصی</h3>
            </div>
            
            <div class="p-6">
                <form method="post" action="{% url 'profile' %}">
                    {% csrf_token %}
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                        <div>
                            <label for="first_name" class="block text-sm font-medium text-gray-700 mb-1">نام</label>
                            <input type="text" id="first_name" name="first_name" value="{{ user.first_name }}" class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        
                        <div>
                            <label for="last_name" class="block text-sm font-medium text-gray-700 mb-1">نام خانوادگی</label>
                            <input type="text" id="last_name" name="last_name" value="{{ user.last_name }}" class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>
                    
                    <div class="mb-6">
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">ایمیل</label>
                        <input type="email" id="email" name="email" value="{{ user.email }}" class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    
                    <div class="flex justify-end">
                        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition">ذخیره تغییرات</button>
                    </div>
                </form>
            </div>
        </div>
        
        <div class="bg-white rounded-lg shadow overflow-hidden mt-6">
            <div class="p-6 border-b border-gray-200">
                <h3 class="text-lg font-medium text-gray-800">تغییر رمز عبور</h3>
            </div>
            
            <div class="p-6">
                <form method="post" action="{% url 'change_password' %}">
                    {% csrf_token %}
                    
                    <div class="mb-4">
                        <label for="old_password" class="block text-sm font-medium text-gray-700 mb-1">رمز عبور فعلی</label>
                        <input type="password" id="old_password" name="old_password" required class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    
                    <div class="mb-4">
                        <label for="new_password1" class="block text-sm font-medium text-gray-700 mb-1">رمز عبور جدید</label>
                        <input type="password" id="new_password1" name="new_password1" required class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    
                    <div class="mb-6">
                        <label for="new_password2" class="block text-sm font-medium text-gray-700 mb-1">تکرار رمز عبور جدید</label>
                        <input type="password" id="new_password2" name="new_password2" required class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    
                    <div class="flex justify-end">
                        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition">تغییر رمز عبور</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    // GSAP Animations for Profile Page
    gsap.from(".bg-white", {
        duration: 0.6,
        y: 20,
        opacity: 0,
        stagger: 0.2,
        ease: "power2.out"
    });
</script>
{% endblock %}
